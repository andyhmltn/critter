[package]
name = "reviewer"
version = "0.1.0"
edition = "2024"
description = "A focused terminal GitHub pull request reviewer"

[[bin]]
name = "reviewer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = "5.2"
tempfile = "3.15"
vimltui = "0.2.11"
